app: vjepa
nodes: 16
tasks_per_node: 8
data:
  dataset_type: VideoDataset
  datasets:
    - /scratch/frafsani/V-Jepa/dataset/DatasetV3/train-20251119T060603Z-1-001/train/updated_jepa.csv
    # - /your_path_to_ssv2_csv_file_index.csv
    # - /your_path_to_howto100m_csv_file_index.csv
  decode_one_clip: true
  batch_size: 24
  num_clips: 1
  num_frames: 16
  tubelet_size: 2
  sampling_rate: 4
  crop_size: 224
  patch_size: 16
  pin_mem: true
  num_workers: 12
  filter_short_videos: false
  clip_duration: null
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0
logging:
  folder: /scratch/frafsani/V-Jepa/jepa/Jepa-logs-ppo
  write_tag: jepa-ppo
loss:
  loss_exp: 1.0
  reg_coeff: 0.0
rl_mask:
  enabled: true
  # -- reinforce: motion-energy block placement (src/masks/trajectory_rl.py)
  # -- ppo: TATS trajectory-attention token sampler (src/masks/tats_ppo.py)
  algo: ppo
  ppo:
    mask_ratio: 0.9               # fraction of tokens that become prediction targets
    warmup_epochs: 10             # random masking, no policy updates (TATS num_epochs_train_mae_only)
    # -- policy network
    embed_dim: 384                # encoder patch embeddings (1024) are projected to this
    traj_attn: true               # false -> plain self-attention block (TATS ablation)
    num_traj_attn_blocks: 1
    num_heads: 8
    mlp_ratio: 4.0
    qkv_bias: false
    drop_rate: 0.0
    traj_approx: orthoformer      # orthoformer | none (exact, O(N^2) memory)
    num_landmarks: 128
    softmax_temp: 1.0
    # -- PPO
    update_every: 1               # rollouts collected before each PPO update (TATS update_steps_mae)
    ppo_epochs: 1                 # passes over the collected rollouts (TATS update_steps_ppo)
    minibatch_size: null          # null -> whole batch; set e.g. 8 if the PPO update runs out of memory
    clip_eps: 0.2
    dual_clip: 3.0                # caps the loss for negative advantages (null to disable)
    target_kl: 0.05               # stop the PPO pass early when approx KL > 1.5x this (null to disable)
    explore_eps: 0.05             # sample from (1-eps)*softmax + eps/N; bounds log-probs, prevents collapse
    entropy_warn: 2.0             # log a warning when policy entropy drops below this (max = ln 1568 = 7.36)
    # -- with Adam only the ratios between the three coefficients matter
    policy_coef: 1.0
    value_coef: 0.5
    entropy_coef: 0.01
    normalize_advantage: true
    reward_scale: 1.0
    clip_grad: 1.0
    lr: 0.0001
    weight_decay: 0.0
    buffer_on_cpu: false
mask:
  - aspect_ratio:
      - 0.75
      - 1.5
    num_blocks: 8
    spatial_scale:
      - 0.15
      - 0.15
    temporal_scale:
      - 1.0
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null
  - aspect_ratio:
      - 0.75
      - 1.5
    num_blocks: 2
    spatial_scale:
      - 0.7
      - 0.7
    temporal_scale:
      - 1.0
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null
meta:
  load_checkpoint: true         # resume from <folder>/jepa-ppo-latest.pth.tar (starts fresh if it does not exist)
  read_checkpoint: null
  seed: 234
  eval_freq: 100
  use_sdpa: true
  dtype: bfloat16
model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 384
  uniform_power: true
  use_mask_tokens: true
  zero_init_mask_tokens: true
optimization:
  ipe: 300
  ipe_scale: 1.25
  clip_grad: 10.0
  weight_decay: 0.04
  final_weight_decay: 0.4
  epochs: 300
  warmup: 40
  start_lr: 0.0002
  lr: 0.000625
  final_lr: 1.0e-06
  ema:
  - 0.998
  - 1.0
