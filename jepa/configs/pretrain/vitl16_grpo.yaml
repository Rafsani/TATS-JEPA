app: vjepa_grpo
nodes: 16
tasks_per_node: 8
data:
  dataset_type: VideoDataset
  datasets:
    - /scratch/frafsani/V-Jepa/dataset/DatasetV3/train-20251119T060603Z-1-001/train/updated_jepa.csv
    # - /your_path_to_ssv2_csv_file_index.csv
    # - /your_path_to_howto100m_csv_file_index.csv
  decode_one_clip: true
  batch_size: 24
  num_clips: 1
  num_frames: 16
  tubelet_size: 2
  sampling_rate: 4
  crop_size: 224
  patch_size: 16
  pin_mem: true
  num_workers: 12
  filter_short_videos: false
  clip_duration: null
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0
logging:
  folder: /scratch/frafsani/V-Jepa/jepa/Jepa-logs-grpo
  write_tag: jepa-grpo
loss:
  loss_exp: 1.0
  reg_coeff: 0.0
rl_mask:
  # -- GRPO-trained TATS masking policy (src/masks/grpo.py, app/vjepa_grpo/train.py)
  grpo:
    group_size: 4                 # masks sampled per clip; V-JEPA trains on all of them
    mask_ratio: 0.9               # fraction of tokens that become prediction targets
    warmup_epochs: 10             # random masks, no policy updates
    reward_sign: 1.0              # +1: a mask's reward is its prediction loss (harder = better, as TATS)
    scale_by_std: true            # divide advantages by the group std (false = Dr. GRPO)
    # -- policy network (same as the PPO version)
    embed_dim: 384
    traj_attn: true
    num_traj_attn_blocks: 1
    num_heads: 8
    mlp_ratio: 4.0
    qkv_bias: false
    drop_rate: 0.0
    traj_approx: orthoformer
    num_landmarks: 128
    softmax_temp: 1.0
    # -- GRPO update
    num_iterations: 1             # updates per rollout; >1 makes the clipping active
    clip_eps: 0.2
    entropy_coef: 0.01
    kl_coef: 0.0                  # KL penalty to the rollout policy (0 = off)
    explore_eps: 0.05             # sample from (1-eps)*softmax + eps/N
    entropy_warn: 2.0
    clip_grad: 1.0
    lr: 0.0001
    weight_decay: 0.0
mask:
  - aspect_ratio:
      - 0.75
      - 1.5
    num_blocks: 8
    spatial_scale:
      - 0.15
      - 0.15
    temporal_scale:
      - 1.0
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null
  - aspect_ratio:
      - 0.75
      - 1.5
    num_blocks: 2
    spatial_scale:
      - 0.7
      - 0.7
    temporal_scale:
      - 1.0
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null
meta:
  load_checkpoint: true         # resume from <folder>/jepa-grpo-latest.pth.tar (starts fresh if it does not exist)
  read_checkpoint: null
  seed: 234
  eval_freq: 100
  use_sdpa: true
  dtype: bfloat16
model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 384
  uniform_power: true
  use_mask_tokens: true
  zero_init_mask_tokens: true
optimization:
  ipe: 300
  ipe_scale: 1.25
  clip_grad: 10.0
  weight_decay: 0.04
  final_weight_decay: 0.4
  epochs: 300
  warmup: 40
  start_lr: 0.0002
  lr: 0.000625
  final_lr: 1.0e-06
  ema:
  - 0.998
  - 1.0
